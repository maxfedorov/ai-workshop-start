# Regenerates the e2e screenshot baselines for Linux, the OS CI itself runs on (a baseline made
# on another OS doesn't match: fonts and rendering differ). Run by hand whenever a change
# intentionally changes what the web view looks like, then review and merge what it commits.
name: Update e2e screenshots
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to update (defaults to the one this is run from)
        required: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:update
      - name: Commit the updated baselines, if any changed
        run: |
          if git status --porcelain tests/e2e | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add tests/e2e
            git commit -m 'Update the e2e screenshot baselines for Linux'
            git push
          else
            echo 'No screenshot changed; nothing to commit.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/web.spec.ts-snapshots/
