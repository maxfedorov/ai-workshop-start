# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      - run: npx playwright install --with-deps chromium
      # Starts the web view itself (./fixture, see playwright.config.ts) and checks it in a
      # real browser: DOM assertions plus a screenshot of each key moment against the
      # committed Linux baseline in tests/e2e/web.spec.ts-snapshots/.
      - run: npm run test:e2e
      # A mismatch's expected/actual/diff PNGs, kept for whoever reviews the failed run.
      - name: Upload e2e failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
