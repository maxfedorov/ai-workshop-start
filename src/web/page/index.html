<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Skill Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c7d2fe'/%3E%3Cstop offset='1' stop-color='%23f0abfc'/%3E%3C/linearGradient%3E%3ClinearGradient id='f' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fde68a'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform='rotate%2845 16 16%29'%3E%3Cpath d='M13.6 21.4Q16 31 18.4 21.4Q16 23.6 13.6 21.4Z' fill='url%28%23f%29'/%3E%3Cpath d='M11 15.6 7 21.2 7.6 23.2 11.6 20.4ZM21 15.6 25 21.2 24.4 23.2 20.4 20.4Z' fill='%23a855f7'/%3E%3Crect x='13' y='19' width='6' height='2.6' rx='0.8' fill='%23818cf8'/%3E%3Cpath d='M16 2.6C20.6 6.6 21.6 12 21 19.6H11C10.4 12 11.4 6.6 16 2.6Z' fill='url%28%23b%29'/%3E%3Ccircle cx='16' cy='11.6' r='2.6' fill='%230b1030' stroke='%2367e8f9' stroke-width='1.3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body data-state="loading">
  <div class="sky" aria-hidden="true">
    <div class="stars stars-small"></div>
    <div class="stars stars-medium"></div>
    <div class="stars stars-large"></div>
    <div class="comet"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Skill Atlas home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c7d2fe"/>
            <stop offset="1" stop-color="#f0abfc"/>
          </linearGradient>
          <linearGradient id="flame-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fde68a"/>
            <stop offset="1" stop-color="#f97316"/>
          </linearGradient>
        </defs>
        <g transform="rotate(45 16 16)">
          <path class="brand-flame" d="M13.6 21.4Q16 31 18.4 21.4Q16 23.6 13.6 21.4Z" fill="url(#flame-gradient)"/>
          <path d="M11 15.6 7 21.2 7.6 23.2 11.6 20.4ZM21 15.6 25 21.2 24.4 23.2 20.4 20.4Z" fill="#a855f7"/>
          <rect x="13" y="19" width="6" height="2.6" rx="0.8" fill="#818cf8"/>
          <path d="M16 2.6C20.6 6.6 21.6 12 21 19.6H11C10.4 12 11.4 6.6 16 2.6Z" fill="url(#brand-gradient)"/>
          <circle cx="16" cy="11.6" r="2.6" fill="#0b1030" stroke="#67e8f9" stroke-width="1.3"/>
        </g>
      </svg>
      <span>Skill Atlas</span>
    </a>
    <form class="scan-form" id="scan-form" role="search">
      <label class="visually-hidden" for="source">GitHub URL or local directory</label>
      <svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="scan-field">
        <input id="source" name="source" type="text" placeholder="https://github.com/owner/repo  or  /path/to/checkout" autocomplete="off" spellcheck="false">
        <button type="button" class="scan-clear" id="scan-clear" aria-label="Clear the scan URL" title="Clear the scan URL"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span>
      <button type="submit" class="button primary">Scan</button>
    </form>
    <div class="repo" id="repo"></div>
  </header>

  <section class="state-panel" id="state-panel" aria-live="polite"></section>

  <main class="layout" id="layout">
    <aside class="sidebar panel" aria-label="Skills">
      <div class="filter">
        <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <input id="filter" type="search" placeholder="Filter skills" aria-label="Filter skills" title="Words, &quot;a phrase&quot;, -word to hide; name:, description:, path: for one field" autocomplete="off" spellcheck="false">
        <kbd title="Press / to filter">/</kbd>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <nav class="skill-nav">
        <ul class="skill-list" id="skill-list"></ul>
      </nav>
      <details class="warnings" id="warnings" hidden>
        <summary></summary>
        <ul></ul>
      </details>
      <p class="hints"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>/</kbd> filter · <kbd>Esc</kbd> clear</p>
    </aside>
    <section class="detail panel" id="detail" tabindex="-1"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
